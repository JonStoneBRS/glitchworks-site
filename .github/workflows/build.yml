name: Rebuild website
# Rebuilds docs/ whenever you edit content, settings or the design on GitHub.
on:
  push:
    branches: [main]
    paths: ["content/**", "src/**", "config.json", "build.mjs"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: site, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: OUT=docs node build.mjs
      - run: |
          git config user.name "glitchworks-site-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild website"
          git pull --rebase && git push
